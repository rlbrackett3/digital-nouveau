        <circle cx="450" cy="400" r="2"/>
        <circle cx="500" cy="100" r="2"/>
        <circle cx="500" cy="350" r="1.5"/>
        <circle cx="550" cy="150" r="2"/>
        <circle cx="580" cy="180" r="1.5"/>
        <circle cx="100" cy="450" r="2"/>
        <circle cx="160" cy="460" r="1.5"/>
        <circle cx="220" cy="470" r="1"/>
        <circle cx="410" cy="510" r="1.5"/>
        <circle cx="470" cy="520" r="1"/>
        <circle cx="490" cy="410" r="1.5"/>
        <circle cx="530" cy="420" r="1"/>
        <circle cx="600" cy="220" r="1.5"/>
        <circle cx="190" cy="490" r="1"/>
        <circle cx="440" cy="540" r="1"/>
        <circle cx="340" cy="350" r="1"/>
        <circle cx="210" cy="240" r="1"/>
        <circle cx="140" cy="480" r="1"/>
        <circle cx="390" cy="390" r="1"/>
        <circle cx="520" cy="440" r="1"/>
        <circle cx="540" cy="460" r="1"/>
        <circle cx="570" cy="190" r="1"/>
        <circle cx="590" cy="200" r="1"/>
        <circle cx="370" cy="260" r="1"/>
        <circle cx="390" cy="270" r="1"/>
      </g>
      
      <!-- Some white nodes -->
      <g fill="rgba(255,255,255,0.3)">
        <circle cx="80" cy="70" r="1.5"/>
        <circle cx="130" cy="120" r="1"/>
        <circle cx="210" cy="160" r="1"/>
        <circle cx="270" cy="250" r="1"/>
        <circle cx="310" cy="310" r="1"/>
        <circle cx="360" cy="380" r="1"/>
