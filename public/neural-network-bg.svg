        <circle cx="510" cy="110" r="1"/>
        <circle cx="560" cy="170" r="1"/>
        <circle cx="120" cy="470" r="1"/>
        <circle cx="170" cy="480" r="1"/>
        <circle cx="250" cy="460" r="1"/>
        <circle cx="320" cy="420" r="1"/>
        <circle cx="380" cy="480" r="1"/>
        <circle cx="430" cy="410" r="1"/>
        <circle cx="460" cy="500" r="1"/>
        <circle cx="490" cy="450" r="1"/>
        <circle cx="600" cy="200" r="1"/>
        <circle cx="530" cy="120" r="1"/>
      </g>
