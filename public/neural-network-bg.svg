<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <pattern id="neural" x="0" y="0" width="600" height="600" patternUnits="userSpaceOnUse">
      <!-- Main neural network lines -->
      <g stroke="rgba(255,255,255,0.15)" stroke-width="0.5" fill="none">
        <!-- Branching structures - top left cluster -->
        <path d="M50,50 Q150,80 200,150 T300,200 T350,280"/>
        <path d="M200,150 Q220,180 250,220 T280,260"/>
        <path d="M250,220 Q260,240 270,250 T290,270"/>
        <path d="M100,100 Q130,120 160,180 T180,230"/>
        <path d="M160,180 Q170,200 190,210 T210,240"/>
        <path d="M150,80 Q180,100 200,150"/>
        <path d="M50,50 Q80,70 100,100"/>
        
        <!-- Center cluster -->
        <path d="M300,300 Q350,280 400,320 T450,300 T500,350"/>
        <path d="M400,320 Q420,340 440,360 T460,380"/>
        <path d="M440,360 Q450,370 470,380 T490,390"/>
        <path d="M350,280 Q370,260 390,270 T410,290"/>
        <path d="M300,300 Q320,320 340,350 T360,380"/>
        <path d="M340,350 Q350,360 370,370 T390,390"/>
        
        <!-- Right cluster -->
        <path d="M500,100 Q520,130 550,150 T580,180 T600,220"/>
        <path d="M550,150 Q560,170 570,190 T590,200"/>
        <path d="M500,100 Q510,110 530,120 T550,150"/>
        <path d="M580,180 Q590,190 600,200 T610,220"/>
        
        <!-- Bottom clusters -->
        <path d="M100,450 Q130,430 160,460 T190,440 T220,470"/>
        <path d="M160,460 Q170,480 190,490 T210,510"/>
        <path d="M100,450 Q120,470 140,480 T160,500"/>
        
        <path d="M350,500 Q380,480 410,510 T440,490 T470,520"/>
        <path d="M410,510 Q420,530 440,540 T460,560"/>
        <path d="M350,500 Q370,520 390,530 T410,550"/>
        
        <path d="M450,400 Q470,380 490,410 T510,390 T530,420"/>
        <path d="M490,410 Q500,430 520,440 T540,460"/>
        <path d="M450,400 Q460,420 480,430 T500,450"/>
        
        <!-- Interconnecting lines -->
        <path d="M200,150 Q250,200 300,300"/>
        <path d="M300,200 Q350,250 400,320"/>
        <path d="M400,320 Q450,200 500,100"/>
        <path d="M350,280 Q450,150 550,150"/>
        <path d="M160,460 Q250,400 350,500"/>
        <path d="M350,500 Q400,450 450,400"/>
        <path d="M220,470 Q300,420 350,500"/>
        
        <!-- Cross connections -->
        <path d="M280,260 Q350,280 400,320"/>
        <path d="M460,380 Q480,390 500,400"/>
        <path d="M210,240 Q300,300 350,350"/>
        <path d="M190,490 Q250,460 350,500"/>
        <path d="M440,540 Q460,500 470,520"/>
        <path d="M520,440 Q510,400 530,420"/>
        
        <!-- Small branches -->
        <path d="M130,120 Q140,140 160,180"/>
        <path d="M170,200 Q180,210 190,210"/>
        <path d="M260,240 Q270,250 290,270"/>
        <path d="M370,260 Q380,270 390,270"/>
        <path d="M320,320 Q340,350 360,380"/>
        <path d="M390,390 Q410,400 430,410"/>
        <path d="M530,120 Q540,130 550,150"/>
        <path d="M570,190 Q580,200 590,200"/>
        <path d="M120,470 Q140,480 160,500"/>
        <path d="M170,480 Q180,490 190,490"/>
        <path d="M380,480 Q390,490 410,510"/>
        <path d="M420,530 Q430,540 440,540"/>
        <path d="M470,380 Q480,390 490,410"/>
        <path d="M480,430 Q490,440 500,450"/>
        
        <!-- Tiny connections -->
        <path d="M50,50 Q70,60 80,70"/>
        <path d="M200,150 Q210,160 220,170"/>
        <path d="M300,300 Q310,310 320,320"/>
        <path d="M500,100 Q510,110 520,120"/>
        <path d="M100,450 Q110,460 120,470"/>
        <path d="M350,500 Q360,510 370,520"/>
        <path d="M450,400 Q460,410 470,420"/>
      </g>
      
      <!-- Nodes -->
      <g fill="rgba(28,235,244,0.4)">
